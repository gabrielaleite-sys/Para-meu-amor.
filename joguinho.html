<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nosso Pequeno Paraíso 💗</title>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #dff6ff;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#game {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 600px;
    overflow: hidden;
    background: linear-gradient(#b9eaff, #fff5fb);
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.screen {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
    background: linear-gradient(#d8f5ff, #fff0f8);
}

.screen h1 {
    color: #743d64;
    font-size: 30px;
    margin: 0 0 12px;
}

.screen p {
    color: #684d61;
    font-size: 17px;
    line-height: 1.5;
    max-width: 390px;
}

button {
    border: none;
    border-radius: 25px;
    padding: 13px 25px;
    margin: 8px;
    font-size: 17px;
    font-weight: bold;
    color: white;
    background: #d979aa;
    box-shadow: 0 5px 12px rgba(80,40,70,.18);
    cursor: pointer;
}

button:active {
    transform: scale(.95);
}

#controls {

    z-index: 5;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
}
