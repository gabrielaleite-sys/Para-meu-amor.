<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Nosso Pequeno Paraíso 💗</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#dff6ff;
}

#game{
  position:relative;
  width:100%;
  height:100vh;
  max-width:600px;
  margin:auto;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:#dff6ff;
}

.screen{
  position:absolute;
  inset:0;
  z-index:10;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:25px;
}

.screen h1{
  font-size:32px;
  color:#b85c8a;
  margin:10px;
}

.screen p{
  font-size:18px;
  color:#75445e;
  max-width:380px;
  line-height:1.5;
}

button{
  border:0;
  border-radius:25px;
  padding:14px 25px;
  margin:8px;
  font-size:17px;
  font-weight:bold;
  color:white;
  background:#d979aa;
  box-shadow:0 5px 12px #0003;
  cursor:pointer;
}

button:active{
  transform:scale(.95);
}

#win,
#lose{
  display:none;
  background:#dff6ffdd;
}

#controls{
  position:absolute;
  z-index:5;
  bottom:20px;
  left:0;
  right:0;
  display:none;
  justify-content:space-between;
  padding:0 20px;
  pointer-events:none;
}

.control{
  pointer-events:auto;
  width:75px;
  height:65px;
  border-radius:20px;
  font-size:30px;
  padding:0;
}

#dino{
  position:fixed;
  left:50%;
  top:55%;
  transform:translate(-50%,-50%) scale(1);
  font-size:110px;
  z-index:50;
  text-align:center;
  transition:transform .2s;
  filter:drop-shadow(0 5px 3px #0003);
}

#roar{
  position:fixed;
  left:50%;
  top:43%;
  transform:translateX(-50%);
  z-index:51;
  font-size:28px;
  font-weight:bold;
  color:#8b405f;
  white-space:nowrap;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="start" class="screen">
  <h1>💗 Nosso Pequeno Paraíso 💗</h1>

  <p>
    Ajude o menino a atravessar as nuvens
    e chegar até a garota no castelo! ☁️🏰
  </p>

  <button onclick="startGame()">
    COMEÇAR 💕
  </
